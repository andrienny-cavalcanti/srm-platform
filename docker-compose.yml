services:
  db:
    image: postgres:16
    container_name: bem-mais-ai-db
    environment:
      POSTGRES_DB: bemmais_ai
      POSTGRES_USER: bemmais
      POSTGRES_PASSWORD: bemmais
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    container_name: bem-mais-ai-api
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./knowledge:/knowledge
    env_file:
      - ./backend/.env
    command: >
      sh -c "pip install -r requirements.txt &&
             python -c 'from app.db.database import Base, engine; Base.metadata.create_all(engine)' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
